services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hospital_booking
      MYSQL_USER: ${DB_USERNAME:-hospital}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hospital}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-password}
    ports:
      - "3306:3306"
    volumes:
      - hospital-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change-root-password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  app:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/hospital_booking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-hospital}
      DB_PASSWORD: ${DB_PASSWORD:-hospital}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment or .env file}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-true}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  hospital-mysql-data:
